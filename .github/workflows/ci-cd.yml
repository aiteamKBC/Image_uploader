# ------------------------------------------------------------
# CI/CD pipeline
#   CI: on every push / pull request -> lint, build, check, test
#   CD: on push to main (after CI passes) -> build Docker images
#       and push them to GitHub Container Registry (ghcr.io)
# ------------------------------------------------------------
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Adds a "Run workflow" button in the Actions tab for manual runs
  workflow_dispatch:

jobs:
  # ---------------- CI: frontend ----------------
  frontend:
    name: Frontend - lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci = clean, exact install from package-lock.json
      - run: npm ci
      - run: npm run lint
      # tsc type-check + vite production build
      - run: npm run build

  # ---------------- CI: backend ----------------
  backend:
    name: Backend - check & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: source venv/bin/activate   # activate the virtual environment
      - run: pip install -r requirements.txt
      
      # Django's system checks (settings, models, urls)
      - run: python manage.py check
      - run: python manage.py test

      - run: sudo systemctl restart image_uploader.service

  # ---------------- CD: build & push images ----------------
  docker:
    name: Build & push ${{ matrix.service }} image
    # Only after both CI jobs pass
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io with GITHUB_TOKEN
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Log in to GHCR only when we will actually push (not on PRs)
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image name must be lowercase: ghcr.io/aiteamkbc/image_uploader-backend
      # Tags: "latest" + the short commit SHA (so you can roll back to any commit)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      # On PRs: build only (proves the Dockerfile still works). On main: build + push.
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------- CD: deploy to the server ----------------
  # The server runs the app WITHOUT Docker: a git clone in /var/www/Image_uploader,
  # the backend in a venv under systemd (image_uploader.service), and the
  # frontend as a static build in frontend/dist.
  deploy:
    name: Deploy to server
    # Only after CI passes, and only for real updates to main (never pull requests)
    needs: [frontend, backend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never run two deploys at the same time; a newer push waits for the current one
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e   # stop at the first failing command

            cd /var/www/Image_uploader

            # 1. Get exactly the commit that passed CI.
            #    reset --hard discards edits to tracked files on the server;
            #    untracked files (.env, venv, node_modules, dist) are kept.
            git fetch origin main
            git reset --hard ${{ github.sha }}

            # 2. Backend: install new/changed packages and apply migrations
            cd backend
            ./venv/bin/pip install -q -r requirements.txt
            ./venv/bin/python manage.py migrate --noinput

            # 3. Frontend: rebuild the static files (reads frontend/.env at build time).
            #    Build into dist-new first and swap it in only on success, so the live
            #    site never serves a half-written dist (and a failed build changes nothing).
            cd ../frontend
            npm ci --no-audit --no-fund
            rm -rf dist-new
            npm run build -- --outDir dist-new --emptyOutDir
            rm -rf dist-old
            [ -d dist ] && mv dist dist-old
            mv dist-new dist
            rm -rf dist-old

            # 4. Restart the backend and make sure it came back up
            systemctl restart image_uploader
            sleep 3
            systemctl is-active --quiet image_uploader || {
              journalctl -u image_uploader -n 30 --no-pager
              exit 1
            }
            echo "Deployed ${{ github.sha }}"
